name: Build Smart-AutoClicker v3 (No Ads + New App ID + Full Source & APK ZIP)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules & Original Assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Apply Smart Scenario v3 + New App ID (com.buzbuz.smartautoclicker.v3pro) + Remove Ads
        run: |
          python3 build_smart_autoclicker_v3_apk.py --patch-only .

      - name: Compile Ad-Free APK (fDroid Flavor with All Original Assets)
        run: |
          chmod +x gradlew
          ./gradlew assembleFDroidDebug

      - name: Compress Full Modified Source Code + Compiled APK into One ZIP
        run: |
          mkdir -p compiled_apk
          find smartautoclicker/build/outputs/apk -name "*.apk" -exec cp {} compiled_apk/ \;
          zip -r Smart-AutoClicker-v3-Full-Source-And-APK.zip . -x ".git/*" ".gradle/*" "**/build/*"
          zip -r Smart-AutoClicker-v3-Full-Source-And-APK.zip compiled_apk/

      - name: Upload Downloadable ZIP (Source Code + APK)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-AutoClicker-v3-Full-Source-And-APK
          path: Smart-AutoClicker-v3-Full-Source-And-APK.zip
